# ==============================================================================
# Production Nginx Configuration for Caffe Platform
# High-Performance SPA Delivery, Caching, Security Headers & Reverse-Proxy Ready
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Healthcheck Endpoint for Load Balancers (Docker, AWS ECS, K8s, Render, Cloudflare)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Immutable Caching for Hashed Vite Assets (JS, CSS, Pre-rendered chunks)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media & Font Assets Caching
    location ~* \.(?:ico|jpg|jpeg|png|webp|avif|gif|svg|mp4|webm|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 301 Permanent Redirects
    rewrite ^/home/?$ / permanent;
    rewrite ^/privacy-policy/?$ /privacy permanent;
    rewrite ^/terms-of-service/?$ /terms permanent;

    # SPA Routing: Fall back to /index.html for client routes
    # 1. Checks exact file match ($uri)
    # 2. Checks exact directory with index.html ($uri/)
    # 3. Falls back to /index.html without changing browser URL
    location / {
        try_files $uri $uri/ /index.html;
        # Short cache for HTML so application updates reflect immediately
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
