    <!-- Critical FOUC & White Flash Elimination on Page Reload -->
    <style id="critical-fouc-guard">
      html, body {
        background-color: #110B08 !important;
        color: #F7EFEA !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      /* Ensure Accessibility Skip Link is NEVER unstyled or visible on page load/reload */
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border-width: 0 !important;
      }
      .sr-only:focus, .focus\:not-sr-only:focus {
        position: fixed !important;
        width: auto !important;
        height: auto !important;
        padding: 0.5rem 1rem !important;
        margin: 0 !important;
        overflow: visible !important;
        clip: auto !important;
        white-space: normal !important;
        top: 1rem !important;
        left: 1rem !important;
        z-index: 99999 !important;
        background-color: #D4AF37 !important;
        color: #120B08 !important;
        font-weight: 700 !important;
        border-radius: 0.5rem !important;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
        text-decoration: none !important;
      }
      /* Pre-Hydration Luxury Monogram Loader */
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        background-color: #110B08;
        color: #D4AF37;
        user-select: none;
      }
      .initial-loader-crest {
        width: 68px;
        height: 68px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .initial-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        animation: initialSpin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .initial-loader-monogram {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 24px;
        color: #D4AF37;
        letter-spacing: 0.05em;
      }
      .initial-loader-skip {
        margin-top: 24px;
        padding: 8px 18px;
        border-radius: 9999px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        background: rgba(17, 11, 8, 0.85);
        color: #D4AF37;
        font-family: 'Outfit', sans-serif, -apple-system, sans-serif;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .initial-loader-skip:hover {
        background: #D4AF37;
        color: #110B08;
      }
      @keyframes initialSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Skip to Main Content Link for Keyboard Navigation (Inlined style guarantees zero FOUC) -->
    <a 
      href="#main-content" 
      style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;"

    <div id="root">
      <div class="initial-loader" role="status" aria-label="Loading application">
        <div class="initial-loader-crest">
          <div class="initial-loader-ring"></div>
          <span class="initial-loader-monogram">TCB</span>
        </div>
        <button type="button" class="initial-loader-skip" onclick="var el=document.querySelector('.initial-loader');if(el)el.remove();" aria-label="Skip intro">Skip &rarr;</button>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var loader = document.querySelector('.initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.25s ease-out';
          setTimeout(function() { loader.remove(); }, 250);
        }
      }, 1200);
    </script>
